{# calculo/templates/calculo/crear.html #}
{% extends "base.html" %}
{% block content %}
<h1>Nuevo registro</h1>
<form method="post">
    {% csrf_token %}
    <label>Insumo: <input type="text" name="insumo" required></label><br>
    <label>Stock actual: <input type="number" step="0.01" name="stock_actual" required></label><br>
    <label>Venta proyectada (M$): <input type="number" step="0.01" name="venta_proyectada" required></label><br>
    <button type="submit">Evaluar y guardar</button>
</form>
{% endblock %}
